name: NIFTY signal notifier

on:
  schedule:
    # Every 10 minutes, every day, any time (UTC cron). Offset to :03, :13, :23 ...
    # because :00/:10 are the busiest minutes and runs there get delayed most.
    - cron: "3-59/10 * * * *"
  workflow_dispatch:

concurrency:
  group: nifty-notifier
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Show current UTC and IST time
        run: |
          echo "UTC: $(date -u '+%a %d-%b-%Y %H:%M:%S')"
          echo "IST: $(TZ=Asia/Kolkata date '+%a %d-%b-%Y %H:%M:%S')"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Caches are immutable, so every run saves under a NEW key
      # and restores the newest older one.
      - name: Restore notifier state
        uses: actions/cache/restore@v4
        with:
          path: notifier_state.json
          key: nifty-notifier-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            nifty-notifier-state-

      - name: Check for NIFTY signals
        env:
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python nifty_notifier.py --once --ignore-market

      # Save even if the script failed, so sent signals are not re-sent.
      - name: Save notifier state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: notifier_state.json
          key: nifty-notifier-state-${{ github.run_id }}-${{ github.run_attempt }}
