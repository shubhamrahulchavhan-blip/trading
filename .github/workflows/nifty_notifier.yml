name: NIFTY signal notifier

on:
  schedule:
    - cron: "45-59/5 3 * * 1-5" # 09:15, 09:20, 09:25 IST
    - cron: "*/5 4-9 * * 1-5"   # 09:30–15:25 IST, every 5 minutes
    - cron: "0-5/5 10 * * 1-5"  # 15:30, 15:35 IST
  workflow_dispatch: {}   # lets you press "Run workflow" manually to test

concurrency:
  group: nifty-notifier
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Show current time (UTC and IST)
        run: |
          echo "UTC: $(date -u '+%a %d-%b %H:%M:%S')"
          echo "IST: $(TZ=Asia/Kolkata date '+%a %d-%b %H:%M:%S')"

      - run: pip install -r requirements.txt

      # remembers which signals were already sent (runners forget everything between runs)
      - uses: actions/cache@v4
        with:
          path: notifier_state.json
          key: notifier-state-${{ github.run_id }}
          restore-keys: notifier-state-

      - name: Check for signals
        env:
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python nifty_notifier.py --once
