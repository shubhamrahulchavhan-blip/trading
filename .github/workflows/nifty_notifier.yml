name: NIFTY signal notifier

on:
  schedule:
    # GitHub cron is always UTC. NSE 09:15-15:30 IST = 03:45-10:00 UTC, Mon-Fri.
    - cron: "45,50,55 3 * * 1-5"
    - cron: "*/5 4-9 * * 1-5"
    - cron: "0 10 * * 1-5"
  workflow_dispatch:

concurrency:
  group: nifty-notifier
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Show current UTC and IST time
        run: |
          echo "UTC: $(date -u '+%a %d-%b-%Y %H:%M:%S')"
          echo "IST: $(TZ=Asia/Kolkata date '+%a %d-%b-%Y %H:%M:%S')"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Caches are immutable: a fixed key is saved once and never updated.
      # So every run saves under a NEW key and restores the newest older one.
      - name: Restore notifier state
        uses: actions/cache/restore@v4
        with:
          path: notifier_state.json
          key: nifty-notifier-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            nifty-notifier-state-

      - name: Check for NIFTY signals
        env:
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python nifty_notifier.py --once

      # Save even if the script failed, so already-sent signals are not re-sent.
      - name: Save notifier state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: notifier_state.json
          key: nifty-notifier-state-${{ github.run_id }}-${{ github.run_attempt }}
