name: NIFTY signal notifier

on:
  schedule:
     - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: nifty-notifier
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Show current UTC and IST time
        run: |
          echo "UTC: $(date -u '+%a %d-%b-%Y %H:%M:%S')"
          echo "IST: $(TZ=Asia/Kolkata date '+%a %d-%b-%Y %H:%M:%S')"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore notifier state
        uses: actions/cache@v4
        with:
          path: notifier_state.json
          key: nifty-notifier-state
          restore-keys: |
            nifty-notifier-state-

      - name: Check for NIFTY signals
        env:
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python nifty_notifier.py --once
