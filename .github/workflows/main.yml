name: NIFTY signal notifier

on:
  schedule:
    # GitHub cron is UTC (IST = UTC + 5:30). NSE 09:15-15:30 IST, Mon-Fri.
    # Minutes are offset (:02, :07, ...) because :00/:05 are the busiest and
    # most delayed; it also lets the 5-minute candle fully close before the run.
    # 09:30 IST = 04:00 UTC (IST minus 5:30). First run 09:32 IST, last 15:32 IST.
    - cron: "2-59/5 4-9 * * 1-5"   # 09:32 to 15:27 IST, every 5 min
    - cron: "2 10 * * 1-5"         # 15:32 IST (last candle)
  workflow_dispatch:

concurrency:
  group: nifty-notifier
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Safety gate: even if a run is triggered outside market hours, exit in
      # seconds (no install, no data download). Manual runs always proceed.
      - name: Market-hours gate (IST)
        id: gate
        run: |
          DOW=$(TZ=Asia/Kolkata date +%u)
          HM=$((10#$(TZ=Asia/Kolkata date +%H%M)))
          echo "IST: $(TZ=Asia/Kolkata date '+%a %d-%b-%Y %H:%M:%S')  (UTC: $(date -u '+%H:%M:%S'))"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || { [ "$DOW" -le 5 ] && [ "$HM" -ge 930 ] && [ "$HM" -le 1540 ]; }; then
            echo "open=true" >> "$GITHUB_OUTPUT"
          else
            echo "open=false" >> "$GITHUB_OUTPUT"
            echo "Outside market hours - skipping."
          fi

      - name: Checkout repository
        if: steps.gate.outputs.open == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.gate.outputs.open == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        if: steps.gate.outputs.open == 'true'
        run: pip install -r requirements.txt

      # Caches are immutable, so every run saves under a NEW key
      # and restores the newest older one.
      - name: Restore notifier state
        if: steps.gate.outputs.open == 'true'
        uses: actions/cache/restore@v4
        with:
          path: notifier_state.json
          key: nifty-notifier-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            nifty-notifier-state-

      - name: Check for NIFTY signals
        if: steps.gate.outputs.open == 'true'
        env:
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python nifty_notifier.py --once

      # Save even if the script failed, so sent signals are not re-sent.
      - name: Save notifier state
        if: always() && steps.gate.outputs.open == 'true'
        uses: actions/cache/save@v4
        with:
          path: notifier_state.json
          key: nifty-notifier-state-${{ github.run_id }}-${{ github.run_attempt }}
