name: NIFTY signal notifier

on:
  schedule:
    # GitHub cron is UTC only (IST = UTC + 5:30). Subtract 5:30 from IST.
    # Market runs: Mon-Fri, first 09:32 IST, last 15:32 IST, every 5 minutes.
    - cron: "2-59/5 4-9 * * 1-5"   # 09:32 to 15:27 IST
    - cron: "2 10 * * 1-5"         # 15:32 IST (last candle)
    # Daily test email: 19:02 IST = 13:32 UTC, Mon-Fri.
    - cron: "32 13 * * 1-5"
  workflow_dispatch:

concurrency:
  group: nifty-notifier
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Gate: stray runs outside market hours exit in seconds (no install, no download).
      # Manual runs and the 7 PM test-email schedule always proceed.
      - name: Market-hours gate (IST)
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          DOW=$(TZ=Asia/Kolkata date +%u)
          HM=$((10#$(TZ=Asia/Kolkata date +%H%M)))
          echo "IST: $(TZ=Asia/Kolkata date '+%a %d-%b-%Y %H:%M:%S')  (UTC: $(date -u '+%H:%M:%S'))"
          if [ "$EVENT" = "workflow_dispatch" ] || [ "$SCHEDULE" = "32 13 * * 1-5" ] || { [ "$DOW" -le 5 ] && [ "$HM" -ge 930 ] && [ "$HM" -le 1540 ]; }; then
            echo "open=true" >> "$GITHUB_OUTPUT"
          else
            echo "open=false" >> "$GITHUB_OUTPUT"
            echo "Outside market hours - skipping."
          fi

      - name: Checkout repository
        if: steps.gate.outputs.open == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.gate.outputs.open == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        if: steps.gate.outputs.open == 'true'
        run: pip install -r requirements.txt

      # Caches are immutable, so every run saves under a NEW key
      # and restores the newest older one.
      - name: Restore notifier state
        if: steps.gate.outputs.open == 'true'
        uses: actions/cache/restore@v4
        with:
          path: notifier_state.json
          key: nifty-notifier-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            nifty-notifier-state-

      # 7 PM schedule -> send a test email. Every other run -> normal signal check.
      - name: Run notifier
        if: steps.gate.outputs.open == 'true'
        env:
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$SCHEDULE" = "32 13 * * 1-5" ]; then
            python nifty_notifier.py --test
          else
            python nifty_notifier.py --once
          fi

      # Save even if the script failed, so sent signals are not re-sent.
      - name: Save notifier state
        if: always() && steps.gate.outputs.open == 'true'
        uses: actions/cache/save@v4
        with:
          path: notifier_state.json
          key: nifty-notifier-state-${{ github.run_id }}-${{ github.run_attempt }}
