name: NIFTY signal notifier

on:
  schedule:
    # GitHub cron is UTC only (IST = UTC + 5:30). Subtract 5:30 from the IST time you want.
    # Runs on these schedules no matter what the market is doing.
    - cron: "2-59/5 4-9 * * 1-5"   # 09:32 to 15:27 IST, every 5 min, Mon-Fri
    - cron: "2 10 * * 1-5"         # 15:32 IST, Mon-Fri
    - cron: "32 13 * * 1-5"        # 19:02 IST, Mon-Fri (delete this line if not needed)
  workflow_dispatch:

concurrency:
  group: nifty-notifier
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Show current UTC and IST time
        run: |
          echo "UTC: $(date -u '+%a %d-%b-%Y %H:%M:%S')"
          echo "IST: $(TZ=Asia/Kolkata date '+%a %d-%b-%Y %H:%M:%S')"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Caches are immutable, so every run saves under a NEW key
      # and restores the newest older one.
      - name: Restore notifier state
        uses: actions/cache/restore@v4
        with:
          path: notifier_state.json
          key: nifty-notifier-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            nifty-notifier-state-

      - name: Check for NIFTY signals
        env:
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python nifty_notifier.py --once --ignore-market

      # Save even if the script failed, so sent signals are not re-sent.
      - name: Save notifier state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: notifier_state.json
          key: nifty-notifier-state-${{ github.run_id }}-${{ github.run_attempt }}
